<!doctype html><html lang="da"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"></head><body><title>Sporlys</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: kamera/lysbord fylder hele skærmen; værktøj flyder ovenpå i top- og bundbjælke. Bevidst ét mørkt tema (kamera-app). */
:root{
  --ink:#121317; --panel:#1b1d23ee; --panel-solid:#1b1d23; --line:#2e313a;
  --fg:#eeebe3; --muted:#9b9da6; --accent:#f0b43c; --accent-ink:#1d1606;
  --ok:#5fd39a; --warn:#f0b43c; --paper:#ffffff;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--ink);color:var(--fg);font:15px/1.4 var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
#app{position:fixed;inset:0}
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;background:#000}
#stage.light{background:var(--paper)}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#stage.light #cam{display:none}
#overlay{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none;will-change:transform}
#overlay svg,#overlay img{display:block;width:100%;height:100%}
#grid{position:absolute;inset:0}

/* Top bar */
#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;
  padding-top:calc(env(safe-area-inset-top,0px) + 10px);padding-bottom:10px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(#000a,#0000)}
.brand{font:700 20px/1 var(--display);letter-spacing:-.01em;margin-right:4px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:22px;border-radius:2px;background:var(--accent);transform:rotate(18deg);display:inline-block}
@media (max-width:460px){.brand span{display:none}}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--ink)}
.spacer{flex:1}
.icon{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;cursor:pointer;flex:none}
.icon svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.icon:focus-visible,.seg button:focus-visible,.tile:focus-visible,.chip:focus-visible,.navbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#status{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);
  background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;display:flex;gap:8px;align-items:center;white-space:nowrap}
#status b{width:8px;height:8px;border-radius:50%;background:var(--warn)}
#status.ok b{background:var(--ok)}

#notice{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 66px);max-width:460px;margin:0 auto;background:var(--panel-solid);border:1px solid var(--line);
  border-radius:16px;padding:14px 16px;display:grid;gap:8px;box-shadow:0 10px 40px #0008}
#notice h3{margin:0;font:700 17px/1.2 var(--display)}
#notice p{margin:0;color:var(--muted);font-size:14px}
#notice .row{display:flex;gap:8px;flex-wrap:wrap}

/* Bottom */
#bottom{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);pointer-events:none}
#bottom>*{pointer-events:auto}
#stepper{align-self:center;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px;max-width:100%}
#stepper .lbl{padding:0 8px;min-width:0;text-align:center}
#stepper .lbl small{display:block;color:var(--muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase}
#stepper .lbl span{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.navbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--fg);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;flex:none}
.navbtn:disabled{opacity:.3}

#sheet{background:var(--panel-solid);border:1px solid var(--line);border-radius:18px;max-width:640px;width:100%;margin:0 auto;box-sizing:border-box;overflow:hidden}
.tabs{display:flex;align-items:center;gap:4px;padding:6px}
.tab{border:0;background:none;padding:8px 14px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-selected="true"]{color:var(--fg);background:#ffffff12}
#collapse{margin-left:auto;border:0;background:none;color:var(--muted);cursor:pointer;padding:8px 10px;font-weight:700;font-size:13px}
.pane{padding:4px 14px 14px;max-height:38vh;overflow:auto;display:grid;gap:14px}
#sheet.closed .pane{display:none}
.label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.tile{border:1px solid var(--line);background:#fff;border-radius:12px;padding:6px 6px 4px;cursor:pointer;display:grid;gap:2px;color:#222;text-align:center}
.tile svg{width:100%;height:70px}
.tile span{font-size:12px;font-weight:700}
.tile[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-1px}
.tile.upload{background:none;color:var(--fg);border-style:dashed;place-items:center;min-height:96px}
.tile.upload svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2}
.field{display:grid;gap:6px}
.field .top{display:flex;justify-content:space-between;align-items:baseline}
.field output{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#ffffff08;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;background:var(--fg);color:var(--ink)}
.btn.ghost{background:#ffffff12;color:var(--fg)}
.swatches{display:flex;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.chip,.tile,.icon,.seg button{transition:background .15s,color .15s}}
</style>

<div id="app">
  <div id="stage" class="light">
    <video id="cam" playsinline muted autoplay></video>
    <div id="overlay"><div id="ovContent"></div><div id="grid" hidden></div></div>
  </div>

  <header id="top">
    <div class="brand"><i></i><span>Sporlys</span></div>
    <div class="seg" role="group" aria-label="Tilstand">
      <button id="mCam" aria-pressed="false">Kamera</button>
      <button id="mLight" aria-pressed="true">Lysbord</button>
    </div>
    <div class="spacer"></div>
    <button class="icon" id="bTrack" aria-pressed="false" title="Fastgør til papiret" aria-label="Fastgør til papiret" hidden>
      <svg viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>
    </button>
    <button class="icon" id="bLock" aria-pressed="false" title="Lås billedet" aria-label="Lås billedet">
      <svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path id="shackle" d="M8 11V8a4 4 0 0 1 8 0"/></svg>
    </button>
    <button class="icon" id="bPeek" title="Hold for at se din egen streg" aria-label="Hold for at skjule skitsen">
      <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </header>

  <div id="status" hidden><b></b><span>Leder efter papir…</span></div>

  <div id="notice" hidden>
    <h3 id="nTitle">Kameraet er ikke tilgængeligt</h3>
    <p id="nText"></p>
    <div class="row"><button class="btn" id="nLight">Brug lysbord</button><button class="btn ghost" id="nRetry">Prøv igen</button></div>
  </div>

  <div id="bottom">
    <div id="stepper" hidden>
      <button class="navbtn" id="sPrev" aria-label="Forrige trin">‹</button>
      <div class="lbl"><small id="sCount">Trin 1 af 6</small><span id="sName">Hovedet</span></div>
      <button class="navbtn" id="sNext" aria-label="Næste trin">›</button>
    </div>

    <section id="sheet">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tMotiv" aria-selected="true">Motiv</button>
        <button class="tab" role="tab" id="tJuster" aria-selected="false">Juster</button>
        <button id="collapse">Skjul ▾</button>
      </div>

      <div class="pane" id="pMotiv">
        <div class="field">
          <div class="label">Mine billeder</div>
          <div class="tiles" id="gallery"></div>
          <p class="hint" id="galStatus" aria-live="polite"></p>
        </div>
        <div id="photoOpts" hidden class="field" style="gap:12px">
          <div class="label">Valgt billede</div>
          <div class="chips" id="viewChips" role="group" aria-label="Visning af billedet">
            <button class="chip" id="vSteps" aria-pressed="false">Trin</button>
            <button class="chip" id="pmSketch" aria-pressed="false">Skitse</button>
            <button class="chip" id="pmLines" aria-pressed="true">Streger</button>
            <button class="chip" id="pmPhoto" aria-pressed="false">Foto</button>
          </div>
          <div class="field" id="detailField">
            <div class="top"><span>Detaljer</span><output id="oDetail">50</output></div>
            <input type="range" id="rDetail" min="0" max="100" value="50">
          </div>
          <div class="field" id="smoothField">
            <div class="top"><span>Udglatning</span><output id="oSmooth">2</output></div>
            <input type="range" id="rSmooth" min="0" max="5" value="2">
          </div>
          <div class="chips">
            <button class="btn ghost" id="gAI" hidden>Lad Claude tegne en guide</button>
            <button class="chip" id="gDelImg">Slet billede</button>
          </div>
          <p class="hint" id="gStatus" aria-live="polite"></p>
        </div>
        <div id="mineWrap" class="field" hidden>
          <div class="label">Guides tegnet af Claude</div>
          <div class="tiles" id="mine"></div>
          <div><button class="chip" id="gDel" hidden>Slet guide</button></div>
        </div>
        <div class="field">
          <div class="label">Indbyggede motiver</div>
          <div class="tiles" id="tiles"></div>
        </div>
        <input type="file" id="file" accept="image/*,.zip,application/zip" multiple hidden>
      </div>

      <div class="pane" id="pJuster" hidden>
        <div class="field">
          <div class="top"><span>Synlighed</span><output id="oOpacity">60 %</output></div>
          <input type="range" id="rOpacity" min="5" max="100" value="60">
        </div>
        <div class="field">
          <span>Stregfarve</span>
          <div class="swatches" id="swatches"></div>
        </div>
                <div class="chips">
          <button class="chip" id="cFlip" aria-pressed="false">Spejlvend</button>
          <button class="chip" id="cGrid" aria-pressed="false">Gitter</button>
          <button class="chip" id="cCenter">Centrer</button>
        </div>
        <p class="hint" id="modeHint"></p>
      </div>
    </section>
  </div>
</div>

<script>
(() => {
const $ = s => document.querySelector(s);
const stage = $('#stage'), video = $('#cam'), ov = $('#overlay'), ovContent = $('#ovContent'), grid = $('#grid');

/* ---------- Lektioner (egne motiver, 300×400) ---------- */
const petals = [0,60,120,180,240,300].map(a => `<ellipse cx="150" cy="70" rx="17" ry="27" transform="rotate(${a} 150 120)"/>`).join('');
const LESSONS = {
  kat:{name:'Kat',steps:[
    ['Hovedet','<ellipse cx="150" cy="120" rx="70" ry="60"/>'],
    ['Ørerne','<path d="M97 86 L102 36 L132 64 M203 86 L198 36 L168 64"/>'],
    ['Kroppen','<path d="M112 172 C82 228 76 318 96 360 L204 360 C224 318 218 228 188 172"/>'],
    ['Øjne og næse','<ellipse cx="122" cy="112" rx="9" ry="12"/><ellipse cx="178" cy="112" rx="9" ry="12"/><path d="M143 134 L157 134 L150 143 Z"/>'],
    ['Mund og knurhår','<path d="M150 143 Q141 155 131 149 M150 143 Q159 155 169 149 M118 138 L70 130 M118 145 L72 150 M182 138 L230 130 M182 145 L228 150"/>'],
    ['Hale og poter','<path d="M204 344 C258 340 270 282 240 250 M124 360 Q128 342 138 360 M162 360 Q172 342 176 360"/>']]},
  hus:{name:'Hus',steps:[
    ['Huset','<rect x="60" y="200" width="180" height="160"/>'],
    ['Taget','<path d="M44 206 L150 100 L256 206"/>'],
    ['Døren','<path d="M130 360 V292 H170 V360"/><circle cx="162" cy="328" r="3"/>'],
    ['Vinduerne','<rect x="80" y="228" width="40" height="40"/><path d="M100 228 V268 M80 248 H120"/><rect x="180" y="228" width="40" height="40"/><path d="M200 228 V268 M180 248 H220"/>'],
    ['Skorsten og røg','<path d="M196 146 V112 H220 V170 M208 98 q10 -12 0 -24 q-10 -12 0 -24"/>'],
    ['Sol og græs','<circle cx="252" cy="58" r="20"/><path d="M20 360 H280 M252 26 V16 M252 90 V100 M220 58 H210 M284 58 H294"/>']]},
  fisk:{name:'Fisk',steps:[
    ['Kroppen','<path d="M60 200 C110 122 210 122 240 200 C210 278 110 278 60 200 Z"/>'],
    ['Halen','<path d="M240 200 L286 160 L274 200 L286 240 Z"/>'],
    ['Øje og mund','<circle cx="100" cy="190" r="9"/><path d="M62 206 Q72 212 82 205"/>'],
    ['Finner og gæller','<path d="M138 143 Q160 106 192 140 M138 257 Q160 290 186 259 M122 164 Q106 200 122 236"/>'],
    ['Skæl','<path d="M150 178 q12 11 0 22 M172 166 q12 11 0 22 M172 202 q12 11 0 22 M194 184 q12 11 0 22"/>'],
    ['Bobler','<circle cx="40" cy="150" r="6"/><circle cx="30" cy="122" r="4"/><circle cx="46" cy="94" r="8"/>']]},
  blomst:{name:'Blomst',steps:[
    ['Midten','<circle cx="150" cy="120" r="24"/>'],
    ['Kronbladene',petals],
    ['Stilken','<path d="M150 144 C144 210 158 280 150 345"/>'],
    ['Bladene','<path d="M152 250 C188 222 216 230 228 246 C200 262 176 262 152 250 Z M149 300 C112 272 84 280 72 296 C100 312 126 312 149 300 Z"/>'],
    ['Potten','<path d="M92 345 H208 L192 396 H108 Z M96 360 H204"/>']]},
  raket:{name:'Raket',steps:[
    ['Kroppen','<path d="M150 40 C190 80 200 150 195 260 H105 C100 150 110 80 150 40 Z"/>'],
    ['Vinduet','<circle cx="150" cy="140" r="22"/><circle cx="150" cy="140" r="13"/>'],
    ['Finnerne','<path d="M106 214 L64 290 L104 268 M194 214 L236 290 L196 268"/>'],
    ['Motoren','<path d="M120 260 L112 286 H188 L180 260"/>'],
    ['Flammerne','<path d="M120 290 Q150 384 180 290 M135 290 Q150 346 165 290"/>'],
    ['Stjerner','<path d="M50 70 v20 M40 80 h20 M246 108 v18 M237 117 h18 M58 344 v14 M51 351 h14 M250 360 v10 M245 365 h10"/>']]}
};
for (const L of Object.values(LESSONS)) { L.vw = 300; L.vh = 400; L.builtin = true; }

/* Gemte guides (tegnet af Claude) */
const GKEY = 'sporlys:guides:v1';
let guides = [];
try { guides = JSON.parse(localStorage.getItem(GKEY) || '[]'); if (!Array.isArray(guides)) guides = []; } catch (e) { guides = []; }
const SAFE_D = /^[MLHVCSQTAZmlhvcsqtaz0-9eE\s,.\-+]+$/;
function guideToLesson(g){ return {name:g.name, vw:300, vh:g.vh, steps:g.steps.map(s => [s.name, s.paths.map(d => `<path d="${d}"/>`).join('')])}; }
guides = guides.filter(g => g && g.id && Array.isArray(g.steps) && g.steps.every(s => Array.isArray(s.paths) && s.paths.every(d => typeof d === 'string' && SAFE_D.test(d))));
for (const g of guides) LESSONS[g.id] = guideToLesson(g);
function saveGuides(){ try { localStorage.setItem(GKEY, JSON.stringify(guides)); } catch (e) {} }

const COLORS = [['Blå','#1f45ff'],['Sort','#111111'],['Rød','#e0302a'],['Grøn','#0b9a5a'],['Hvid','#ffffff']];

/* ---------- State ---------- */
const S = {
  mode:'light', tracking:false, locked:false, opacity:.6, color:'#1f45ff', grid:false, flip:false, fill:.85,
  x:0, y:0, s:1, r:0, W:300, H:400,
  src:'kat', step:0, photoMode:'lines', detail:50, smooth:2
};
let camOK = false, photo = null, photoLines = null, quad = null, lastSeen = 0, peeking = false;
const KEY = 'sporlys:v1';
let restoreWant = null;
try { const saved = JSON.parse(localStorage.getItem(KEY) || '{}');
  for (const k of ['opacity','color','grid','flip','fill','src','step','detail','smooth']) if (k in saved) S[k] = saved[k];
  if ((S.src === 'photo' || S.src === 'auto') && saved.photoId) restoreWant = {src:S.src, photoId:saved.photoId, mode:saved.photoMode, step:S.step};
  if (!LESSONS[S.src]) { S.src = 'kat'; S.step = 0; }
} catch (e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify({opacity:S.opacity,color:S.color,grid:S.grid,flip:S.flip,fill:S.fill,src:(S.src === 'photo' || S.src === 'auto' || LESSONS[S.src]) ? S.src : 'kat',step:S.step,detail:S.detail,smooth:S.smooth,photoMode:S.photoMode,photoId:(S.src === 'photo' || S.src === 'auto') ? photoId : null})); } catch (e) {} }

/* ---------- Overlay rendering ---------- */
function lessonSVG(id, upto, color, thumb){
  const L = LESSONS[id]; let g = '';
  L.steps.forEach(([, m], i) => {
    if (thumb) { g += `<g>${m}</g>`; return; }
    if (i > upto) return;
    const cur = i === upto;
    g += `<g stroke-width="${cur ? 5 : 3.5}" opacity="${cur ? 1 : .55}">${m}</g>`;
  });
  return `<svg viewBox="0 0 ${L.vw} ${L.vh}" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="${color}" stroke-linecap="round" stroke-linejoin="round" stroke-width="${thumb?7:4}">${g}</svg>`;
}

function renderOverlay(){
  if (S.src === 'photo' && photo) {
    const url = S.photoMode === 'photo' ? photo.src : photoLines;
    ovContent.innerHTML = `<img alt="" src="${url}">`;
  } else {
    if (!LESSONS[S.src]) { S.src = 'kat'; S.step = 0; }
    ovContent.innerHTML = lessonSVG(S.src, S.step, S.color);
  }
  ov.style.width = S.W + 'px'; ov.style.height = S.H + 'px';
  const cell = Math.max(S.W, S.H) / 8;
  grid.hidden = !S.grid;
  grid.style.backgroundImage = `linear-gradient(${S.color}99 1px, transparent 1px), linear-gradient(90deg, ${S.color}99 1px, transparent 1px)`;
  grid.style.backgroundSize = `${cell}px ${cell}px`;
  grid.style.backgroundPosition = `${(S.W % cell)/2}px ${(S.H % cell)/2}px`;
  ov.style.opacity = peeking ? 0 : S.opacity;
  renderStepper();
  applyTransform();
}

function renderStepper(){
  const st = $('#stepper');
  const L = LESSONS[S.src];
  if (!L) { st.hidden = true; return; }
  st.hidden = false;
  $('#sCount').textContent = `${L.name} · trin ${S.step+1} af ${L.steps.length}`;
  $('#sName').textContent = L.steps[S.step][0];
  $('#sPrev').disabled = S.step === 0;
  $('#sNext').disabled = S.step === L.steps.length - 1;
}

function fitOverlay(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  S.s = Math.min(sw * .82 / S.W, sh * .62 / S.H);
  S.x = sw / 2; S.y = sh * .47; S.r = 0;
  applyTransform();
}

function overlayMatrix(h){ return `matrix3d(${h[0]},${h[3]},0,${h[6]},${h[1]},${h[4]},0,${h[7]},0,0,1,0,${h[2]},${h[5]},0,${h[8]})`; }
function applyTransform(){
  if (S.tracking && A.sm) {
    const h = homography([[0,0],[S.W,0],[S.W,S.H],[0,S.H]], A.sm);
    if (h) { ov.style.transform = overlayMatrix(h); return; }
  }
  const fx = S.flip ? -1 : 1;
  ov.style.transform = `translate(${S.x}px,${S.y}px) rotate(${S.r}rad) scale(${S.s*fx},${S.s}) translate(${-S.W/2}px,${-S.H/2}px)`;
}
// Skitsens fire hjørner på skærmen i fri tilstand
function freeCorners(){

  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL('image/png');
}
function makeLines(){
  if (!photo) return;
  const {gray, w, h} = grayOf(photo, 1000);
  if (S.photoMode === 'sketch') {
    photoLines = toneURL(pencil(gray, w, h, 3 + S.smooth * 3), w, h, 1.5 + S.detail / 18, .8);
    S.W = w; S.H = h; return;
  }
  const m = dropSmall(edgeLevel(gray, w, h, S.smooth, .97 - S.detail / 100 * .1), w, h, 8);
  photoLines = maskURL(m, w, h, Math.max(1, Math.round(w / 700)));
  S.W = w; S.H = h;
}

/* Automatisk trin-guide */
function makeAutoGuide(){
  if (!photo) return false;
  const {gray, w, h} = grayOf(photo, 800);
  const steps = autoSteps(gray, w, h, S.detail);
  if (!steps.length) return false;
  const vh = Math.round(300 * h / w), thick = Math.max(1, Math.round(w / 500));
  LESSONS.auto = {name:'Mit foto', vw:300, vh, auto:true,
    steps: steps.map(s => [s.name, `<image href="${maskURL(s.mask, w, h, thick)}" x="0" y="0" width="300" height="${vh}" preserveAspectRatio="none"/>`])};
  // Sidste trin: toner og skygger som en blyantsskitse af fotoet
  LESSONS.auto.steps.push(['Skygger og toner', `<image href="${toneURL(pencil(gray, w, h, 10), w, h, 1.5 + S.detail / 25, .9)}" x="0" y="0" width="300" height="${vh}" preserveAspectRatio="none"/>`]);
  return true;
}

let lineTimer = 0;
function scheduleLines(){
  clearTimeout(lineTimer);
  lineTimer = setTimeout(() => {
    if (S.src === 'auto') { makeAutoGuide(); S.step = Math.min(S.step, LESSONS.auto.steps.length - 1); }
    else makeLines();
    renderOverlay();
  }, 150);
}

function selectSource(id){
  S.src = id;
  if (id === 'photo') { makeLines(); }
  else { const L = LESSONS[id]; S.step = Math.min(S.step, L.steps.length - 1); if (S.step < 0) S.step = 0; S.W = 300; S.H = Math.round(300 * L.vh / L.vw); }
  if (S.tracking) setTracking(false);
  renderTiles(); renderOverlay(); fitOverlay(); save();
}

/* ---------- Mine billeder (gemt i browseren med IndexedDB) ---------- */
let gallery = [], photoId = null, dbP = null;
function idb(){
  if (dbP) return dbP;
  dbP = new Promise(res => {
    try {
      const r = indexedDB.open('sporlys', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('images', {keyPath: 'id'});
      r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null);
    } catch (e) { res(null); }
  });
  return dbP;
}
function idbReq(mode, fn){
  return idb().then(db => new Promise(res => {
    if (!db) return res(null);
    try { const tx = db.transaction('images', mode); const q = fn(tx.objectStore('images')); q.onsuccess = () => res(q.result === undefined ? true : q.result); q.onerror = () => res(null); }
    catch (e) { res(null); }
  }));
}
const idbAll = () => idbReq('readonly', s => s.getAll());
const idbPut = rec => idbReq('readwrite', s => s.put(rec));
const idbDel = id => idbReq('readwrite', s => s.delete(id));

function loadImg(blob){
  return new Promise((res, rej) => { const u = URL.createObjectURL(blob), im = new Image(); im.onload = () => res(im); im.onerror = () => { URL.revokeObjectURL(u); rej(); }; im.src = u; });
}
async function shrink(blob){
  const im = await loadImg(blob);
  const sc = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
  if (sc === 1 && blob.size < 3e6) return blob;
  const c = document.createElement('canvas');
  c.width = Math.round(im.naturalWidth * sc); c.height = Math.round(im.naturalHeight * sc);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(im, 0, 0, c.width, c.height);
  URL.revokeObjectURL(im.src);
  const png = blob.type === 'image/png';
  return new Promise(res => c.toBlob(b => res(b || blob), png ? 'image/png' : 'image/jpeg', .9));
}
let zipP = null;
function loadZip(){
  if (window.JSZip) return Promise.resolve(window.JSZip);
  if (zipP) return zipP;
  zipP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
    s.onload = () => window.JSZip ? res(window.JSZip) : rej(); s.onerror = () => { zipP = null; rej(); };
    document.head.appendChild(s);
  });
  return zipP;
}
const IMG_RE = /\.(png|jpe?g|webp|gif)$/i;
const mimeOf = n => /\.png$/i.test(n) ? 'image/png' : /\.webp$/i.test(n) ? 'image/webp' : /\.gif$/i.test(n) ? 'image/gif' : 'image/jpeg';
function setGal(t){ $('#galStatus').textContent = t || ''; }

async function addImage(blob, name){
  try {
    const small = await shrink(blob);
    const rec = {id: 'i_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), name: String(name || 'Billede').replace(/^.*\//, '').replace(/\.[^.]+$/, '').slice(0, 40), blob: small, added: Date.now()};
    rec.saved = !!(await idbPut(rec));
    gallery.unshift(rec);
    return rec;
  } catch (e) { return null; }
}

async function importFiles(files){
  let added = 0, bad = 0, unsaved = 0, first = null;
  setGal('Henter billeder…');
  const add = async (b, n) => { const r = await addImage(b, n); if (r) { added++; if (!r.saved) unsaved++; first = first || r; renderGallery(); setGal(`Henter billeder… ${added}`); } else bad++; };
  for (const f of files) {
    if (/\.zip$/i.test(f.name) || /zip/.test(f.type)) {
      let JSZip;
      try { JSZip = await loadZip(); } catch (e) { bad++; setGal('Zip-filer kan ikke åbnes lige nu. Vælg billederne enkeltvis i stedet.'); continue; }
      try {
        const z = await JSZip.loadAsync(f);
        const entries = Object.values(z.files).filter(e => !e.dir && IMG_RE.test(e.name) && !/(^|\/)(__MACOSX|\.)/.test(e.name));
        for (const e of entries) await add(new Blob([await e.async('arraybuffer')], {type: mimeOf(e.name)}), e.name);
      } catch (e) { bad++; }
    } else if (/^image\//.test(f.type) || IMG_RE.test(f.name)) {
      await add(f, f.name);
    } else bad++;
  }
  let msg = added ? `${added} ${added === 1 ? 'billede' : 'billeder'} tilføjet.` : 'Ingen billeder blev tilføjet.';
  if (bad) msg += ` ${bad} ${bad === 1 ? 'fil' : 'filer'} kunne ikke læses.`;
  if (unsaved) msg += ' Browseren tillader ikke at gemme her, så de forsvinder, når siden lukkes.';
  setGal(msg);
  if (first) openImage(first, 'auto');
}

$('#file').addEventListener('change', e => {
  const files = [...(e.target.files || [])]; e.target.value = '';
  if (files.length) importFiles(files);
});

async function openImage(rec, view){
  try {
    const im = await loadImg(rec.blob);
    if (photo && photo.src.startsWith('blob:')) URL.revokeObjectURL(photo.src);
    photo = im; photoId = rec.id; delete LESSONS.auto; setGStatus('');
    if (view === 'auto' && makeAutoGuide()) { S.step = 0; selectSource('auto'); }
    else { S.photoMode = (view === 'photo' || view === 'sketch') ? view : 'lines'; selectSource('photo'); }
  } catch (e) { setGal('Billedet kunne ikke åbnes.'); }
}

function renderGallery(){
  const g = $('#gallery'); g.innerHTML = '';
  const u = document.createElement('button'); u.className = 'tile upload';
  u.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Tilføj billeder</span>';
  u.onclick = () => $('#file').click();
  g.appendChild(u);
  for (const rec of gallery) {
    if (!rec.thumb) rec.thumb = URL.createObjectURL(rec.blob);
    const b = document.createElement('button'); b.className = 'tile';
    b.setAttribute('aria-pressed', photoId === rec.id && (S.src === 'photo' || S.src === 'auto'));
    const img = document.createElement('img'); img.alt = ''; img.src = rec.thumb;
    img.style.cssText = 'width:100%;height:70px;object-fit:contain';
    const sp = document.createElement('span'); sp.textContent = rec.name;
    sp.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
    b.append(img, sp);
    b.onclick = () => openImage(rec, 'auto');
    g.appendChild(b);
  }
}

let delImgArmed = 0;
$('#gDelImg').addEventListener('click', async () => {
  if (!photoId) return;
  if (Date.now() - delImgArmed > 3000) { delImgArmed = Date.now(); $('#gDelImg').textContent = 'Tryk igen for at slette'; setTimeout(() => { $('#gDelImg').textContent = 'Slet billede'; }, 3000); return; }
  delImgArmed = 0; $('#gDelImg').textContent = 'Slet billede';
  await idbDel(photoId);
  const r = gallery.find(x => x.id === photoId); if (r && r.thumb) URL.revokeObjectURL(r.thumb);
  gallery = gallery.filter(x => x.id !== photoId);
  photo = null; photoId = null; delete LESSONS.auto; S.step = 0;
  selectSource('kat'); setGal('Billedet er slettet.');
});

$('#vSteps').onclick = () => {
  if (!photo) return;
  if (makeAutoGuide()) { S.step = 0; selectSource('auto'); }
  else setGStatus('Billedet har for lidt kontrast til at lave trin. Prøv Streger eller et skarpere billede.');
};

async function restoreGallery(){
  const all = await idbAll();
  if (Array.isArray(all)) gallery = all.filter(r => r && r.blob).sort((a, b) => b.added - a.added);
  renderGallery();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) {}
  const want = restoreWant;
  if (want && want.photoId) {
    const rec = gallery.find(r => r.id === want.photoId);
    if (rec) { const st = want.step || 0; await openImage(rec, want.src === 'auto' ? 'auto' : want.mode); if (S.src === 'auto' && LESSONS.auto) { S.step = Math.min(st, LESSONS.auto.steps.length - 1); renderOverlay(); } }
  }
}

/* ---------- Guide tegnet af Claude ---------- */
let sampleFn = null, aiCtl = null, photoFile = null;
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    const s = await window.claude.use('sample'); if (!s) return;
    const lim = await s.limits().catch(() => null);
    if (lim && lim.images) { sampleFn = s; $('#gAI').hidden = false; }
  } catch (e) {}
})();

function setGStatus(t){ $('#gStatus').textContent = t || ''; }

async function photoBlob(){
  const sc = Math.min(1, 1400 / Math.max(photo.naturalWidth, photo.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(photo.naturalWidth * sc); c.height = Math.round(photo.naturalHeight * sc);
  c.getContext('2d').drawImage(photo, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(b => res(b), 'image/jpeg', .9));
}

function aiPrompt(vh){
  return `Du er tegnelærer for begyndere. Det vedhæftede billede er et foto, som brugeren vil tegne af på papir.

Lav en forenklet stregtegning af fotoets hovedmotiv i stil med en trin-for-trin tegneguide: rene konturlinjer, ingen skygger, ingen skravering, ingen fyld. Del tegningen op i 4 til 7 trin i den rækkefølge, man ville tegne det: først de store grundformer og omrids, så de vigtigste indre linjer, til sidst små detaljer.

Tegningen skal ligge præcist oven på fotoet. Brug koordinatsystemet viewBox="0 0 300 ${vh}", hvor 0,0 er fotoets øverste venstre hjørne, og 300,${vh} er nederste højre hjørne. Placer linjerne der, hvor tingene faktisk er på fotoet.

Svar kun med JSON i denne form:
{"title":"kort dansk navn på motivet","steps":[{"name":"kort dansk trinnavn","paths":["M 40 60 C 80 20 140 20 180 60"]}]}

Regler for paths: hver streng er en SVG path d-attribut og må kun indeholde kommandoerne M L H V C S Q T A Z (store eller små bogstaver), tal, mellemrum, komma og minus. 1 til 12 paths pr. trin. Hold dig inden for viewBox.`;
}

function parseGuide(res, vh){
  if (!res || !Array.isArray(res.steps)) return null;
  const steps = [];
  for (const s of res.steps.slice(0, 10)) {
    if (!s || !Array.isArray(s.paths)) continue;
    const paths = s.paths.filter(d => typeof d === 'string' && d.length < 6000 && SAFE_D.test(d)).slice(0, 20);
    if (paths.length) steps.push({name: String(s.name || 'Trin').slice(0, 40), paths});
  }
  if (steps.length < 2) return null;
  const title = String(res.title || 'Min guide').slice(0, 30);
  return {id: 'g_' + Date.now().toString(36), name: title, vh, steps};
}

const AI_ERR = {
  not_granted: 'Du har ikke givet siden lov til at bruge Claude, så Claude kan ikke tegne guiden. Automatisk trin virker stadig.',
  sampling_disabled: 'Claude er ikke tilgængelig på denne konto lige nu.',
  rate_limited: 'Du har brugt meget af din Claude-kvote. Vent lidt og prøv igen.',
  image_rejected: 'Billedet kunne ikke sendes. Prøv et andet billede, fx et JPG.',
  refused: 'Claude ville ikke tegne en guide af dette billede. Prøv et andet motiv.',
  invalid_json: 'Claudes svar kunne ikke læses som en guide. Prøv igen.',
  session_expired: 'Du skal logge ind i Claude igen.'
};

$('#gAI').addEventListener('click', async () => {
  if (aiCtl) { aiCtl.abort(); return; }
  if (!photo || !sampleFn) return;
  aiCtl = new AbortController();
  const btn = $('#gAI'); btn.textContent = 'Stop';
  setGStatus('Claude tegner din guide. Det tager typisk et halvt til to minutter.');
  const vh = Math.round(300 * photo.naturalHeight / photo.naturalWidth);
  try {
    const blob = await photoBlob();
    const res = await sampleFn.json(aiPrompt(vh), {images: [blob], modelTier: 'complex', signal: aiCtl.signal});
    const g = parseGuide(res, vh);
    if (!g) throw {code: 'invalid_json'};
    guides.push(g); saveGuides(); LESSONS[g.id] = guideToLesson(g);
    S.step = 0; selectSource(g.id);
    setGStatus(`Færdig: ${g.steps.length} trin. Guiden er gemt under Mine guides.`);
  } catch (e) {
    const code = e && e.code;
    setGStatus(code === 'cancelled' ? 'Stoppet.' : (AI_ERR[code] || 'Noget gik galt hos Claude. Prøv igen om lidt.'));
    if (code === 'images_unavailable' || code === 'not_declared' || code === 'capability_disabled') btn.hidden = true;
  } finally {
    aiCtl = null; btn.textContent = 'Lad Claude tegne en guide';
  }
});

let delArmed = 0;
$('#gDel').addEventListener('click', () => {
  const id = S.src; if (!id.startsWith('g_')) return;
  if (Date.now() - delArmed > 3000) { delArmed = Date.now(); $('#gDel').textContent = 'Tryk igen for at slette'; setTimeout(() => { $('#gDel').textContent = 'Slet guide'; }, 3000); return; }
  guides = guides.filter(g => g.id !== id); saveGuides(); delete LESSONS[id];
  $('#gDel').textContent = 'Slet guide'; delArmed = 0; S.step = 0; selectSource('kat');
});

/* ---------- Panel ---------- */
function tileBtn(pressed, inner, onclick){
  const b = document.createElement('button'); b.className = 'tile';
  b.setAttribute('aria-pressed', pressed); b.innerHTML = inner; b.onclick = onclick; return b;
}
function renderTiles(){
  const t = $('#tiles'); t.innerHTML = '';
  const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  for (const [id, L] of Object.entries(LESSONS)) {
    if (!L.builtin) continue;
    t.appendChild(tileBtn(S.src === id, lessonSVG(id, 99, '#26272b', true) + `<span>${L.name}</span>`, () => { S.step = 0; selectSource(id); }));
  }
  const mine = $('#mine'); mine.innerHTML = '';
  for (const g of guides) {
    mine.appendChild(tileBtn(S.src === g.id, lessonSVG(g.id, 99, '#26272b', true) + `<span>${esc(g.name)}</span>`, () => { S.step = 0; selectSource(g.id); }));
  }
  $('#mineWrap').hidden = !guides.length;
  $('#photoOpts').hidden = !photo;
  $('#gDel').hidden = !S.src.startsWith('g_');
  const isPhoto = S.src === 'photo';
  $('#vSteps').setAttribute('aria-pressed', S.src === 'auto');
  $('#pmLines').setAttribute('aria-pressed', isPhoto && S.photoMode === 'lines');
  $('#pmPhoto').setAttribute('aria-pressed', isPhoto && S.photoMode === 'photo');
  $('#pmSketch').setAttribute('aria-pressed', isPhoto && S.photoMode === 'sketch');
  $('#gDelImg').hidden = !photoId;
  $('#smoothField').hidden = !(isPhoto && S.photoMode !== 'photo');
  $('#detailField').hidden = !((isPhoto && S.photoMode !== 'photo') || S.src === 'auto');
  renderGallery();
}
function renderSwatches(){
  const box = $('#swatches'); box.innerHTML = '';
  for (const [name, c] of COLORS) {
    const b = document.createElement('button'); b.className = 'sw'; b.style.background = c;
    b.title = name; b.setAttribute('aria-label', name); b.setAttribute('aria-pressed', S.color === c);
    b.onclick = () => { S.color = c; renderSwatches(); if (S.src === 'photo') makeLines(); if (S.src === 'auto') makeAutoGuide(); renderOverlay(); save(); };
    box.appendChild(b);
  }
}

function tab(which){
  $('#tMotiv').setAttribute('aria-selected', which === 'motiv');
  $('#tJuster').setAttribute('aria-selected', which === 'juster');
  $('#pMotiv').hidden = which !== 'motiv'; $('#pJuster').hidden = which !== 'juster';
  $('#sheet').classList.remove('closed'); $('#collapse').textContent = 'Skjul ▾';
}
$('#tMotiv').onclick = () => tab('motiv');
$('#tJuster').onclick = () => tab('juster');
$('#collapse').onclick = () => { const c = $('#sheet').classList.toggle('closed'); $('#collapse').textContent = c ? 'Vis ▴' : 'Skjul ▾'; };

$('#sPrev').onclick = () => { if (S.step > 0) { S.step--; renderOverlay(); save(); } };
$('#sNext').onclick = () => { if (S.step < LESSONS[S.src].steps.length - 1) { S.step++; renderOverlay(); save(); } };

$('#rOpacity').oninput = e => { S.opacity = e.target.value / 100; $('#oOpacity').textContent = e.target.value + ' %'; ov.style.opacity = S.opacity; save(); };
$('#rDetail').oninput = e => { S.detail = +e.target.value; $('#oDetail').textContent = e.target.value; scheduleLines(); save(); };
$('#rSmooth').oninput = e => { S.smooth = +e.target.value; $('#oSmooth').textContent = e.target.value; scheduleLines(); save(); };
$('#pmLines').onclick = () => { if (!photo) return; S.photoMode = 'lines'; selectSource('photo'); };
$('#pmSketch').onclick = () => { if (!photo) return; S.photoMode = 'sketch'; selectSource('photo'); };
$('#pmPhoto').onclick = () => { if (!photo) return; S.photoMode = 'photo'; selectSource('photo'); };
$('#cFlip').onclick = () => { S.flip = !S.flip; $('#cFlip').setAttribute('aria-pressed', S.flip); applyTransform(); save(); };
$('#cGrid').onclick = () => { S.grid = !S.grid; $('#cGrid').setAttribute('aria-pressed', S.grid); renderOverlay(); save(); };
$('#cCenter').onclick = () => fitOverlay();

$('#mCam').onclick = () => startCamera();
$('#mLight').onclick = () => { hideNotice(); setMode('light'); };
$('#nLight').onclick = () => { hideNotice(); setMode('light'); };
$('#nRetry').onclick = () => startCamera();
$('#bTrack').onclick = () => setTracking(!S.tracking);
$('#bLock').onclick = () => setLock(!S.locked);

const peek = on => { peeking = on; ov.style.opacity = on ? 0 : S.opacity; $('#bPeek').setAttribute('aria-pressed', on); };
$('#bPeek').addEventListener('pointerdown', e => { e.preventDefault(); peek(true); });
for (const ev of ['pointerup','pointerleave','pointercancel']) $('#bPeek').addEventListener(ev, () => peek(false));
$('#bPeek').addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') peek(true); });
$('#bPeek').addEventListener('keyup', () => peek(false));

window.addEventListener('resize', () => { if (!S.tracking) { S.x = Math.min(S.x, stage.clientWidth); S.y = Math.min(S.y, stage.clientHeight); } applyTransform(); });

/* ---------- Start ---------- */
$('#rOpacity').value = Math.round(S.opacity * 100); $('#oOpacity').textContent = Math.round(S.opacity * 100) + ' %';
$('#rDetail').value = S.detail; $('#oDetail').textContent = S.detail; $('#rSmooth').value = S.smooth; $('#oSmooth').textContent = S.smooth;
$('#cFlip').setAttribute('aria-pressed', S.flip); $('#cGrid').setAttribute('aria-pressed', S.grid);
renderTiles(); renderSwatches(); renderOverlay(); fitOverlay(); setMode('light');
restoreGallery();
startCamera();
})();
